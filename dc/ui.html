<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>docconvert · 离线格式转换</title>
<style>
:root{
  --bg:#0d0f12; --surface:#16191e; --surface2:#1d2128; --surface3:#242931;
  --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.14);
  --txt:#e9ecef; --txt2:#9ba3ae; --txt3:#697280;
  --accent:#4ecdc4; --accent-dim:rgba(78,205,196,.14); --accent-line:rgba(78,205,196,.45);
  --warn:#f0a742; --warn-dim:rgba(240,167,66,.12);
  --err:#f06a6a; --err-dim:rgba(240,106,106,.12);
  --radius:14px; --radius-sm:9px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.55; display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased;
}

/* ---------- 顶栏 ---------- */
header{
  display:flex; align-items:center; justify-content:space-between;
  padding:0 26px; height:58px; flex-shrink:0;
  border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:baseline; gap:9px; font-size:16px; font-weight:600; letter-spacing:.2px}
.brand em{font-style:normal; color:var(--accent)}
.brand small{font-size:11.5px; font-weight:400; color:var(--txt3); letter-spacing:0}
.health{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--txt2); cursor:default}
.health b{color:var(--txt); font-weight:500}
.dot{width:6px;height:6px;border-radius:50%;background:var(--txt3);flex-shrink:0}
.dot.ok{background:var(--accent); box-shadow:0 0 0 3px var(--accent-dim)}
.dot.warn{background:var(--warn); box-shadow:0 0 0 3px var(--warn-dim)}

/* ---------- 主体 ---------- */
main{flex:1; overflow-y:auto; padding:26px}
.wrap{max-width:880px; margin:0 auto}

/* ---------- 拖放区 ---------- */
.drop{
  border:1.5px dashed var(--line2); border-radius:var(--radius);
  padding:38px 24px; text-align:center; cursor:pointer;
  background:var(--surface); transition:.18s border-color,.18s background;
}
.drop:hover{border-color:var(--accent-line); background:var(--accent-dim)}
.drop.over{border-color:var(--accent); background:var(--accent-dim); border-style:solid}
.drop .ico{
  width:38px; height:38px; margin:0 auto 12px; border-radius:11px;
  background:var(--accent-dim); border:1px solid var(--accent-line);
  display:flex; align-items:center; justify-content:center;
  font-size:19px; color:var(--accent); line-height:1;
}
.drop h2{font-size:14.5px; font-weight:500; margin-bottom:5px}
.drop p{font-size:12.5px; color:var(--txt3)}
.drop kbd{
  font-family:inherit; font-size:11.5px; padding:1px 6px; border-radius:5px;
  background:var(--surface3); border:1px solid var(--line); color:var(--txt2);
}

/* ---------- 格式选择 ---------- */
.section{margin-top:22px}
.section-label{
  font-size:12px; color:var(--txt3); margin-bottom:9px;
  display:flex; align-items:center; gap:8px;
}
.section-label b{color:var(--txt2); font-weight:500}
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{
  font-family:inherit; font-size:13px; font-weight:500;
  padding:7px 15px; border-radius:var(--radius-sm);
  background:var(--surface2); border:1px solid var(--line);
  color:var(--txt2); cursor:pointer; transition:.14s all;
  display:inline-flex; align-items:center; gap:6px;
}
.chip:hover{border-color:var(--line2); color:var(--txt)}
.chip.on{
  background:var(--accent-dim); border-color:var(--accent-line);
  color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent-line);
}
.chip .n{font-size:11px; color:var(--txt3); font-weight:400}
.chip.on .n{color:var(--accent); opacity:.7}
.chip.more{
  background:transparent; border-style:dashed; color:var(--txt3);
}
.chip.more:hover{color:var(--txt2); border-color:var(--line2)}

.all-panel{
  margin-top:10px; padding:14px; border-radius:var(--radius-sm);
  background:var(--surface); border:1px solid var(--line);
  display:none;
}
.all-panel.open{display:block}
.all-panel .grp{margin-bottom:12px}
.all-panel .grp:last-child{margin-bottom:0}
.all-panel .gname{
  font-size:11px; color:var(--txt3); margin-bottom:6px; letter-spacing:.4px;
}

/* ---------- 队列 ---------- */
.queue{margin-top:24px; display:flex; flex-direction:column; gap:9px}
.qhead{
  display:flex; align-items:center; justify-content:space-between;
  font-size:12px; color:var(--txt3); margin-bottom:2px;
}
.qhead a{color:var(--txt2); text-decoration:none; cursor:pointer}
.qhead a:hover{color:var(--txt)}

.card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); padding:13px 15px;
  display:grid; grid-template-columns:auto 1fr auto; gap:13px; align-items:center;
  transition:.15s border-color;
}
.card:hover{border-color:var(--line2)}
.card.done{opacity:.72}
.card.done:hover{opacity:1}
.card.err{border-color:rgba(240,106,106,.3)}

/* 文件类型色块 */
.ftype{
  width:38px; height:38px; border-radius:10px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:9.5px; font-weight:700; letter-spacing:.3px; text-transform:uppercase;
}
.ft-doc{background:rgba(90,150,240,.16); color:#7fb0f5; border:1px solid rgba(90,150,240,.28)}
.ft-sheet{background:rgba(76,190,130,.16); color:#6ecf9b; border:1px solid rgba(76,190,130,.28)}
.ft-slide{background:rgba(240,150,80,.16); color:#f0a868; border:1px solid rgba(240,150,80,.28)}
.ft-pdf{background:rgba(230,90,90,.16); color:#ee8585; border:1px solid rgba(230,90,90,.28)}
.ft-img{background:rgba(170,120,230,.16); color:#b995ec; border:1px solid rgba(170,120,230,.28)}
.ft-media{background:rgba(230,110,170,.16); color:#e58ab8; border:1px solid rgba(230,110,170,.28)}
.ft-other{background:var(--surface3); color:var(--txt3); border:1px solid var(--line)}

.fname{font-size:13.5px; word-break:break-all; line-height:1.4}
.fmeta{font-size:11.5px; color:var(--txt3); margin-top:3px; display:flex; gap:9px; flex-wrap:wrap}
.fmeta .sep{opacity:.4}
.arrow{color:var(--txt3); font-size:11.5px}

.right{display:flex; align-items:center; gap:9px; flex-shrink:0}
.status{font-size:12px; color:var(--txt3); white-space:nowrap}
.status.ok{color:var(--accent)}
.status.bad{color:var(--err)}
.status.warn{color:var(--warn)}
.btn-dl{
  font-size:12px; padding:5px 13px; border-radius:7px; cursor:pointer;
  background:var(--accent-dim); color:var(--accent);
  border:1px solid var(--accent-line); text-decoration:none;
}
.btn-dl:hover{background:rgba(78,205,196,.22)}
.btn-x{
  background:none; border:none; color:var(--txt3); cursor:pointer;
  font-size:16px; line-height:1; padding:4px 6px; border-radius:6px;
}
.btn-x:hover{color:var(--err); background:var(--err-dim)}

/* 进度条 */
.bar{
  grid-column:1/-1; height:2px; border-radius:2px; margin-top:1px;
  background:var(--surface3); overflow:hidden;
}
.bar i{
  display:block; height:100%; width:35%; border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  animation:slide 1.1s linear infinite;
}
@keyframes slide{from{transform:translateX(-120%)}to{transform:translateX(340%)}}

/* 提示条 */
.note{
  grid-column:1/-1; font-size:11.5px; line-height:1.5;
  padding:8px 11px; border-radius:8px;
  display:flex; gap:7px; align-items:flex-start;
}
.note.warn{background:var(--warn-dim); color:#e8b76a; border:1px solid rgba(240,167,66,.2)}
.note.err{background:var(--err-dim); color:#ec8b8b; border:1px solid rgba(240,106,106,.2)}
.note .i{flex-shrink:0; opacity:.85}

/* ---------- 底部操作栏 ---------- */
footer{
  flex-shrink:0; border-top:1px solid var(--line); background:var(--bg);
  padding:13px 26px;
}
.fbar{max-width:880px; margin:0 auto; display:flex; align-items:center; gap:12px}
.hint{font-size:12px; color:var(--txt3); flex:1}
button.primary{
  font-family:inherit; font-size:13.5px; font-weight:500;
  padding:9px 24px; border-radius:9px; border:1px solid transparent;
  background:var(--accent); color:#052b28; cursor:pointer;
  transition:.15s opacity;
}
button.primary:hover:not(:disabled){opacity:.85}
button.primary:disabled{opacity:.25; cursor:not-allowed}
button.ghost{
  font-family:inherit; font-size:13px; padding:9px 16px; border-radius:9px;
  background:transparent; color:var(--txt3); border:1px solid var(--line); cursor:pointer;
}
button.ghost:hover{color:var(--txt2); border-color:var(--line2)}

.empty{
  text-align:center; padding:44px 0 30px; color:var(--txt3); font-size:12.5px;
}
</style>
</head>
<body>

<header>
  <div class="brand">doc<em>convert</em> <small>离线格式转换</small></div>
  <div class="health" id="health"><span class="dot" id="dot"></span><span id="htxt">检测引擎…</span></div>
</header>

<main>
<div class="wrap">

  <div class="drop" id="drop">
    <div class="ico">↓</div>
    <h2>拖入文件，或点击选择</h2>
    <p>支持 docx · xlsx · pptx · pdf · png · md · csv 等 22 种 · 扫描件自动识别 · 也可 <kbd>Ctrl</kbd>+<kbd>V</kbd> 粘贴</p>
    <input type="file" id="fileInput" multiple hidden>
  </div>

  <div class="section" id="fmtSection" style="display:none">
    <div class="section-label">输出为 <b id="fmtHint"></b></div>
    <div class="chips" id="chips"></div>
    <div class="all-panel" id="allPanel"></div>
  </div>

  <div class="queue" id="queue"></div>

</div>
</main>

<footer>
  <div class="fbar">
    <div class="hint" id="hint">拖入文件开始</div>
    <button class="ghost" id="clearBtn">清空</button>
    <button class="primary" id="runBtn" disabled>开始转换</button>
  </div>
</footer>

<script>
const $ = s => document.querySelector(s);
let STATUS = null, items = [], globalTo = '', notice = '';

/* 常用格式：按使用频率排，不做字母序 */
const COMMON = ['pdf','docx','md','txt','png','jpg','xlsx','csv'];

/* 格式族 → 中文名（"更多"面板分组用） */
const FAM_LABEL = {
  '文档':'文档','表格':'表格','演示':'演示','PDF':'PDF',
  '标记':'文本 / 标记','文本':'纯文本 / 数据','图片':'图片','音视频':'音视频'
};

const FTYPE_OF = {
  docx:'doc', doc:'doc', odt:'doc', rtf:'doc', wps:'doc',
  xlsx:'sheet', xls:'sheet', ods:'sheet', csv:'sheet', tsv:'sheet',
  pptx:'slide', ppt:'slide', odp:'slide',
  pdf:'pdf',
  png:'img', jpg:'img', jpeg:'img', webp:'img', bmp:'img', gif:'img',
  tiff:'img', tif:'img', ico:'img', svg:'img', ppm:'img',
  mp4:'media', mp3:'media', wav:'media', avi:'media', mkv:'media',
  webm:'media', mov:'media', flac:'media', aac:'media', ogg:'media',
};

/* ---------------- 初始化 ---------------- */
async function boot(){
  try{
    STATUS = await (await fetch('/api/status')).json();
    const r = STATUS.ready, t = STATUS.total;
    $('#htxt').innerHTML = `引擎 <b>${r}/${t}</b> 就绪`;
    $('#dot').className = 'dot ' + (r === t ? 'ok' : r ? 'warn' : '');
    if(r < t){
      const miss = STATUS.engines.filter(e => !e.ok).map(e => e.label);
      $('#health').title = '未就绪：' + miss.join('、');
    }
  }catch(e){
    $('#htxt').innerHTML = '<b>服务未连接</b>，刷新页面重试';
    $('#dot').className = 'dot warn';
  }
}

/* ---------------- 格式候选 ---------------- */
function targetsOf(ext){
  return (STATUS && STATUS.reach && STATUS.reach[ext]) || [];
}

/* 所有待转文件都能接受的目标格式（交集）—— 全局按钮组只显示这些，
   避免用户选了一个部分文件不支持、转完才报错的格式 */
function commonTargets(){
  let inter = null;
  for(const it of items){
    if(!it.targets.length) continue;
    inter = (inter === null) ? [...it.targets] : inter.filter(t => it.targets.includes(t));
  }
  return inter || [];
}

/* 所有可能的目标格式（并集）—— "更多"面板用 */
function allTargets(){
  const s = new Set();
  for(const it of items) it.targets.forEach(t => s.add(t));
  return [...s].sort();
}

function renderFormats(){
  const sec = $('#fmtSection');
  if(!items.some(it => it.targets.length)){ sec.style.display = 'none'; return; }
  sec.style.display = '';

  const common = commonTargets();
  const sorted = [...common].sort((a,b) => {
    const ia = COMMON.indexOf(a), ib = COMMON.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
  });
  const head = sorted.filter(t => COMMON.includes(t)).slice(0, 7);
  const rest = sorted.filter(t => !head.includes(t));

  if(!globalTo || !common.includes(globalTo)){
    globalTo = head.includes('pdf') ? 'pdf' : (head[0] || common[0] || '');
  }

  $('#chips').innerHTML = '';
  head.forEach(t => {
    const b = document.createElement('button');
    b.className = 'chip' + (t === globalTo ? ' on' : '');
    b.textContent = t.toUpperCase();
    b.onclick = () => { globalTo = t; renderFormats(); renderQueue(); };
    $('#chips').appendChild(b);
  });

  const more = document.createElement('button');
  more.className = 'chip more';
  more.textContent = `更多格式${rest.length ? ' (' + common.length + ')' : ''} ▾`;
  more.onclick = () => {
    const p = $('#allPanel');
    p.classList.toggle('open');
    if(p.classList.contains('open')) buildAllPanel(common);
  };
  $('#chips').appendChild(more);

  const n = items.filter(it => it.targets.length).length;
  $('#fmtHint').textContent = n > 1 ? `${n} 个文件统一输出` : '';
}

function buildAllPanel(common){
  const panel = $('#allPanel');
  const fams = STATUS ? STATUS.families : {};
  let html = '';
  for(const [fam, exts] of Object.entries(fams)){
    const hits = exts.filter(e => common.includes(e));
    if(!hits.length) continue;
    html += `<div class="grp"><div class="gname">${FAM_LABEL[fam] || fam}</div><div class="chips">`;
    hits.forEach(t => {
      html += `<button class="chip${t === globalTo ? ' on' : ''}" data-to="${t}">${t.toUpperCase()}</button>`;
    });
    html += `</div></div>`;
  }
  if(!html) html = `<div class="gname">没有对所有文件都适用的格式</div>`;
  panel.innerHTML = html;
  panel.querySelectorAll('[data-to]').forEach(b => {
    b.onclick = () => {
      globalTo = b.dataset.to;
      panel.classList.remove('open');
      renderFormats(); renderQueue();
    };
  });
}

/* ---------------- 队列 ---------------- */
function addFiles(files){
  notice = '';
  if(!STATUS){
    // 服务没连上时 reach 表是空的，若照常走流程会把所有文件标成"不支持"，
    // 用户看到的结论完全是错的。必须区分「服务不通」和「格式不支持」。
    notice = '还没连上服务，请刷新页面（Ctrl+F5）后重试';
    renderQueue(); return;
  }
  for(const f of files){
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    const targets = targetsOf(ext);
    items.push({
      id: Math.random().toString(36).slice(2),
      file: f, ext, size: f.size, targets,
      state: targets.length ? 'wait' : 'unsupported',
      msg: '', warn: [], download: '', usedTo: ''
    });
  }
  renderFormats(); renderQueue();
}

function fmtSize(n){
  if(n < 1024) return n + ' B';
  if(n < 1048576) return (n/1024).toFixed(0) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}

function renderQueue(){
  const q = $('#queue');
  q.innerHTML = '';
  if(!items.length){
    q.innerHTML = '<div class="empty">还没有文件</div>';
    updateBar(); return;
  }

  const head = document.createElement('div');
  head.className = 'qhead';
  const pend = items.filter(i => i.state === 'wait').length;
  const done = items.filter(i => i.state === 'done').length;
  head.innerHTML = `<span>${items.length} 个文件${done ? ` · 已完成 ${done}` : ''}</span>`;
  if(done > 1){
    const a = document.createElement('a');
    a.textContent = '批量下载';
    a.onclick = downloadAll;
    head.appendChild(a);
  }
  q.appendChild(head);

  items.forEach(it => q.appendChild(cardOf(it)));
  updateBar();
}

function cardOf(it){
  const c = document.createElement('div');
  c.className = 'card' + (it.state === 'done' ? ' done' : it.state === 'err' ? ' err' : '');

  // 类型色块
  const t = document.createElement('div');
  t.className = 'ftype ft-' + (FTYPE_OF[it.ext] || 'other');
  t.textContent = (it.ext || '?').slice(0, 4);

  // 文件信息
  const info = document.createElement('div');
  const arrow = it.state === 'done' ? ` <span class="arrow">→ ${it.usedTo}</span>` : '';
  info.innerHTML = `<div class="fname">${esc(it.file.name)}${arrow}</div>
    <div class="fmeta"><span>${fmtSize(it.size)}</span></div>`;

  // 右侧
  const right = document.createElement('div');
  right.className = 'right';

  if(it.state === 'wait'){
    right.innerHTML = `<span class="status">待转换</span>`;
  }else if(it.state === 'running'){
    right.innerHTML = `<span class="status">转换中…</span>`;
  }else if(it.state === 'done'){
    right.innerHTML = `<span class="status ok">${it.msg}</span>`;
    const a = document.createElement('a');
    a.className = 'btn-dl'; a.href = it.download; a.textContent = '下载';
    a.setAttribute('download', '');
    right.appendChild(a);
  }else if(it.state === 'unsupported'){
    right.innerHTML = `<span class="status bad">不支持</span>`;
  }else{
    right.innerHTML = `<span class="status bad">失败</span>`;
  }

  const x = document.createElement('button');
  x.className = 'btn-x'; x.textContent = '×'; x.title = '移除';
  x.onclick = () => { items = items.filter(i => i.id !== it.id); renderFormats(); renderQueue(); };
  right.appendChild(x);

  c.append(t, info, right);

  if(it.state === 'running'){
    const b = document.createElement('div');
    b.className = 'bar'; b.innerHTML = '<i></i>';
    c.appendChild(b);
  }
  if(it.warn && it.warn.length){
    const w = document.createElement('div');
    w.className = 'note warn';
    w.innerHTML = `<span class="i">!</span><span>${esc(it.warn.join('；'))}</span>`;
    c.appendChild(w);
  }
  if(it.state === 'err' && it.msg){
    const e = document.createElement('div');
    e.className = 'note err';
    e.innerHTML = `<span class="i">×</span><span>${esc(it.msg)}</span>`;
    c.appendChild(e);
  }
  if(it.state === 'unsupported'){
    const n = document.createElement('div');
    n.className = 'note err';
    const why = it.ext
      ? `不认识 <b>.${esc(it.ext)}</b> 这种格式`
      : `文件没有扩展名，无法判断类型`;
    const list = STATUS ? Object.keys(STATUS.reach).sort() : [];
    n.innerHTML = `<span class="i">×</span><span>${why}。
      当前能转换 ${list.length} 种：${list.join(' · ')}</span>`;
    c.appendChild(n);
  }
  return c;
}

function updateBar(){
  const wait = items.filter(i => i.state === 'wait');
  const bad = items.filter(i => i.state === 'unsupported');
  const noCommon = wait.length > 0 && !globalTo;
  $('#runBtn').disabled = !wait.length || !globalTo;
  if(notice){
    $('#hint').textContent = notice;
  }else if(!items.length){
    $('#hint').textContent = '拖入文件开始';
  }else if(bad.length && !wait.length){
    $('#hint').textContent = `${bad.length} 个格式不支持，请移除后换文件`;
  }else if(noCommon){
    // 例如同时拖入 docx 和 mp4：两者没有共同的目标格式
    $('#hint').textContent = '这些文件没有共同的输出格式，建议分批转换';
  }else if(wait.length){
    $('#hint').textContent = `待转换 ${wait.length} 个${globalTo ? ' → ' + globalTo.toUpperCase() : ''}`;
  }else{
    const done = items.filter(i => i.state === 'done').length;
    $('#hint').textContent = `已完成 ${done} 个`;
  }
}

/* ---------------- 转换 ---------------- */
async function runOne(it){
  it.state = 'running'; it.usedTo = globalTo; renderQueue();

  const qs = new URLSearchParams({to: globalTo, name: it.file.name});
  // 扫描件不用勾选：PDF 抽不到文本层时，路由会自动降级到 Tesseract

  try{
    const r = await fetch('/api/convert?' + qs, {method: 'PUT', body: it.file});
    const d = await r.json();
    if(d.ok){
      it.state = 'done';
      it.msg = `${d.size_human} · ${d.seconds}s`;
      it.warn = d.warn || [];
      it.download = d.download;
      it.usedTo = d.dst_ext || globalTo;
    }else{
      it.state = 'err'; it.msg = (d.error || '转换失败').slice(0, 160);
    }
  }catch(e){
    it.state = 'err'; it.msg = String(e).slice(0, 120);
  }
  renderQueue();
}

async function runAll(){
  const todo = items.filter(i => i.state === 'wait');
  if(!todo.length || !globalTo) return;
  $('#runBtn').disabled = true;
  for(const it of todo) await runOne(it);
  renderQueue();
}

/* 批量下载：把已完成的逐个触发下载（浏览器会连续保存） */
function downloadAll(){
  items.filter(i => i.state === 'done' && i.download).forEach((it, i) => {
    setTimeout(() => {
      const a = document.createElement('a');
      a.href = it.download; a.download = ''; document.body.appendChild(a);
      a.click(); a.remove();
    }, i * 350);
  });
}

/* ---------------- 事件 ---------------- */
const drop = $('#drop'), fi = $('#fileInput');
drop.onclick = () => fi.click();
fi.onchange = e => { addFiles(e.target.files); fi.value = ''; };

['dragenter','dragover'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => {
  const dt = e.dataTransfer;
  const dirs = [], files = [];
  // 文件夹在 dataTransfer 里是个「没有扩展名、size 为 0」的条目，
  // 直接丢给 addFiles 会显示成"不支持格式"，用户根本猜不到原因。
  if(dt.items && dt.items.length){
    for(const item of dt.items){
      const entry = item.webkitGetAsEntry && item.webkitGetAsEntry();
      if(entry && entry.isDirectory){ dirs.push(entry.name); continue; }
      const f = item.getAsFile && item.getAsFile();
      if(f) files.push(f);
    }
  }else{
    for(const f of dt.files) files.push(f);
  }
  if(dirs.length) notice = `「${dirs.join('、')}」是文件夹，请拖入里面的具体文件`;
  if(files.length) addFiles(files);
  renderQueue();
});

/* 粘贴上传 */
document.addEventListener('paste', e => {
  const fs = e.clipboardData && e.clipboardData.files;
  if(fs && fs.length){ e.preventDefault(); addFiles(fs); }
});

$('#runBtn').onclick = runAll;
$('#clearBtn').onclick = () => { items = []; globalTo = ''; renderFormats(); renderQueue(); };

function esc(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

boot().then(() => renderQueue());
</script>
</body>
